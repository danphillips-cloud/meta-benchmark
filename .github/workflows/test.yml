name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned so the runner image does not change under us.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # Oldest and newest supported.
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python3 tests/test_tool.py

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Committed build matches the source
        run: git diff --exit-code web/
